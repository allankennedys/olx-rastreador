name: Monitor OLX

on:
  schedule:
    - cron: "0 * * * *"   # de hora em hora (UTC; o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      teste:
        description: "Só mandar um anúncio de teste no Telegram"
        type: boolean
        default: false

permissions:
  contents: write  # para gravar o vistos.json de volta no repositório

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar anúncios e avisar no Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # filtros de região: acrescente --cidades "Feira de Santana" e/ou --bairros "..."
        run: python monitor.py ${{ inputs.teste && '--teste ps5 -c consoles -p 1' || '' }}

      - name: Salvar anúncios já vistos
        # always(): mesmo se o monitor falhar no meio, guarda o que já foi enviado
        if: ${{ always() && !inputs.teste }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add vistos.json
          git diff --cached --quiet || git commit -m "vistos: $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --quiet && git push
